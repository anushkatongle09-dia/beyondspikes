<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Exercises · Beyond The Spikes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --brand-primary: #f97316;
      --brand-text: #1f2937;
      --brand-muted: #6b7280;
      --brand-bg: #f3f4f6;
      --brand-white: #ffffff;
      --brand-border: #fed7aa;
      --band-blue: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--brand-bg);
      color: var(--brand-text);
      line-height: 1.65;
    }
    .site-top {
      background: var(--brand-white);
      border-bottom: 1px solid var(--brand-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .site-top a.home-link {
      font-weight: 600;
      color: var(--brand-primary);
      text-decoration: none;
    }
    .site-top a.home-link:hover {
      text-decoration: underline;
    }
    .site-top .logo-link {
      display: flex;
      align-items: center;
    }
    .site-top .logo-link img {
      max-height: 56px;
      width: auto;
      object-fit: contain;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3.5rem;
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    main h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      margin: 0 0 1rem;
      line-height: 1.2;
      color: var(--band-blue);
    }
    .coming-soon {
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      color: var(--brand-muted);
      margin: 0;
    }
    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.85rem;
      color: var(--brand-muted);
      border-top: 1px solid var(--brand-border);
      background: var(--brand-white);
    }
  </style>
</head>
<body>
  <div class="site-top">
    <a class="logo-link" href="index.html" aria-label="Home">
      <img src="images/logo.png" alt="Beyond The Spikes">
    </a>
    <a class="home-link" href="index.html">← Back to home</a>
  </div>

  <main>
    <h1>Daily Exercises</h1>
    <p class="coming-soon">Coming soon ...</p>
  </main>

  <footer>
    © 2026 Beyond The Spikes · All rights reserved.
  </footer>
</body>
</html>
